name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — tests + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests (auth, authorization, validation)
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

  frontend:
    name: Frontend — typecheck + lint + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        # Reports only: ~27 pre-existing errors live in the app screens.
        # Remove `continue-on-error` once that debt is cleared.
        run: npx expo lint
        continue-on-error: true

      - name: Dependency audit
        # Upstream Expo / NativeWind advisories; tracked, not blocking.
        run: npm audit --audit-level=high
        continue-on-error: true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # TODO (Phase 0): the two committed `.env` files are still present in the
      # git history until the credential rotation + `git filter-repo` purge is
      # done. Once that lands, remove `continue-on-error` so a hit fails the
      # build, and consider scanning the full history rather than just the
      # commits in this push.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
